kind = "web"
previewPath = "/"
title = "Reiki Healing"
version = "1.0.0"
id = "artifacts/reiki-healing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18828

[services.development]
run = "pnpm --filter @workspace/reiki-healing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reiki-healing", "run", "build" ]
publicDir = "artifacts/reiki-healing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18828"
BASE_PATH = "/"
